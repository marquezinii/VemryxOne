name: Build installer and publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag to build (vX.Y.Z or vX.Y.Z-preview)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      publish:
        description: Create the public GitHub release after every check passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build_audit:
    name: Build and audit installer
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      asset_version: ${{ steps.release.outputs.asset_version }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate tag and channel
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          . ./scripts/Installer.Common.ps1
          $version = Get-ProjectVersion -Workspace (Get-Location).Path
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Directory.Build.props Version must be numeric SemVer: $version"
          }

          $assetVersion = if ($env:RELEASE_CHANNEL -eq 'preview') { "$version-preview" } else { $version }
          $expectedTag = "v$assetVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag/channel mismatch. Expected '$expectedTag', got '$env:RELEASE_TAG'."
          }

          if ($env:RELEASE_CHANNEL -eq 'stable') {
            ./scripts/Test-PublicVersionProgression.ps1 -Version $version
          }

          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw 'Checked out commit does not match the requested tag.'
          }
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            # Secret-bearing signing and deployment steps must never execute
            # source selected only by an arbitrary tag. Resolve main from the
            # remote inside this trusted workflow and require the stable tag
            # to identify that exact reviewed commit before any secrets are
            # made available to later steps.
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve the trusted origin/main release commit.'
            }
            $trustedMainCommit = (git rev-parse refs/remotes/origin/main).Trim()
            if ($tagCommit -ne $trustedMainCommit) {
              throw 'Stable release tag must point to the current origin/main commit.'
            }
          }
          if (git status --porcelain=v1 --untracked-files=all) {
            throw 'Release checkout is not clean.'
          }

          "asset_version=$assetVersion" >> $env:GITHUB_OUTPUT

      - name: Safety verification and build
        shell: pwsh
        run: |
          ./scripts/Verify-Safety.ps1 -SkipTests
          dotnet test tests/Vemryx.One.Tests/Vemryx.One.Tests.csproj `
            --configuration Release `
            --no-build

      - name: Write Google sign-in overlay
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # Machine-local overlay (see RemoteServicesOptionsLoader / the
          # Content glob in Vemryx.One.App.csproj) that a normal checkout
          # never has. Written here, right before the publish that Build-
          # Installer.ps1 triggers, so the official installer ships with
          # "Continuar com o Google" enabled instead of silently hiding it.
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_SECRET)) {
            throw 'Google OAuth secrets are required to build the public installer.'
          }
          $overlay = [ordered]@{
            googleOAuthClientId     = $env:GOOGLE_OAUTH_CLIENT_ID
            googleOAuthClientSecret = $env:GOOGLE_OAUTH_CLIENT_SECRET
          }
          $overlay | ConvertTo-Json | Set-Content -LiteralPath ./src/Vemryx.One.App/Config/appsettings.Production.local.json -Encoding utf8

      - name: Build hardened self-contained package and installer
        shell: pwsh
        env:
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
        # -Harden obfuscates Vemryx.One.Core / Vemryx.One.Windows inside the
        # published runtime before it is hashed and signed, so every public
        # release asset ships the hardened binaries. See docs/release-hardening.md.
        run: ./scripts/Build-Installer.ps1 -Version $env:ASSET_VERSION -Harden

      - name: Upload obfuscation symbol maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obfuscation-maps-${{ steps.release.outputs.asset_version }}
          path: artifacts/obfuscation-maps/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned build candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VemryxOne-unsigned-${{ steps.release.outputs.asset_version }}
          path: |
            artifacts/FiveMCleaner-win-x64/**
            artifacts/installer/**
          if-no-files-found: error
          retention-days: 14

  sign_release:
    name: Sign audited release candidate
    needs: build_audit
    runs-on: windows-latest
    timeout-minutes: 20
    # Configure this GitHub Environment with required reviewers. Its secrets
    # are online CI keys, never an offline root or an Authenticode credential.
    environment: release-signing

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download unsigned build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: VemryxOne-unsigned-${{ needs.build_audit.outputs.asset_version }}
          path: artifacts

      - name: Build release signer without secrets
        shell: pwsh
        run: dotnet build ./src/Vemryx.One.ReleaseTool/Vemryx.One.ReleaseTool.csproj --configuration Release

      - name: Sign broker integrity manifest
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
          BROKER_INTEGRITY_SIGNING_PASSWORD: ${{ secrets.BROKER_INTEGRITY_SIGNING_PASSWORD }}
          BROKER_INTEGRITY_SIGNING_PRIVATE_KEY: ${{ secrets.BROKER_INTEGRITY_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BROKER_INTEGRITY_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:BROKER_INTEGRITY_SIGNING_PASSWORD)) {
            throw 'The protected signing environment requires the broker integrity signing key.'
          }
          $privateKey = Join-Path $env:RUNNER_TEMP 'vemryx-one-broker-private.pem'
          try {
            [IO.File]::WriteAllText($privateKey, $env:BROKER_INTEGRITY_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
            $env:FIVEMCLEANER_SIGNING_PASSWORD = $env:BROKER_INTEGRITY_SIGNING_PASSWORD
            $versionRoot = "./artifacts/FiveMCleaner-win-x64/Runtime/versions/$env:ASSET_VERSION"
            dotnet run --project ./src/Vemryx.One.ReleaseTool/Vemryx.One.ReleaseTool.csproj --configuration Release --no-build -- `
              sign-broker "$versionRoot/broker/SHA256SUMS.txt" $env:ASSET_VERSION $privateKey "$versionRoot/broker-integrity.json"
            if ($LASTEXITCODE -ne 0) { throw 'Signing the broker integrity manifest failed.' }
            dotnet run --project ./src/Vemryx.One.ReleaseTool/Vemryx.One.ReleaseTool.csproj --configuration Release --no-build -- `
              verify-broker "$versionRoot/broker-integrity.json" ./src/Vemryx.One.App/Assets/broker-integrity-public-key.pem
            if ($LASTEXITCODE -ne 0) { throw 'The broker manifest does not match the embedded broker key.' }
          }
          finally { if (Test-Path -LiteralPath $privateKey) { Remove-Item -LiteralPath $privateKey -Force } }

      - name: Repackage signed broker and validate runtime
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          ./scripts/Finalize-BrokerIntegrity.ps1 -Version $env:ASSET_VERSION
          ./scripts/Test-HardenedRuntime.ps1 -RuntimeDirectory ./artifacts/FiveMCleaner-win-x64 -Version $env:ASSET_VERSION
          $installer = Resolve-Path "./artifacts/installer/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe"
          ./scripts/Test-Installer.ps1 -InstallerPath $installer -PublishDirectory ./artifacts/FiveMCleaner-win-x64 -ExpectedVersion $env:ASSET_VERSION

      - name: Stage and sign release assets
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          UPDATE_MANIFEST_SIGNING_PASSWORD: ${{ secrets.UPDATE_MANIFEST_SIGNING_PASSWORD }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/release | Out-Null
          Copy-Item -LiteralPath "./artifacts/installer/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe.sha256" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/VemryxOne-release-manifest-$env:ASSET_VERSION.json" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/FiveMCleaner-Setup-$env:ASSET_VERSION-win-x64.exe" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/FiveMCleaner-Setup-$env:ASSET_VERSION-win-x64.exe.sha256" -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/FiveMCleaner-win-x64.zip -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/FiveMCleaner-win-x64.zip.sha256 -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/FiveMCleaner-Runtime-win-x64.zip -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/FiveMCleaner-Runtime-win-x64.zip.sha256 -Destination ./artifacts/release

          # A landing page precisa de um endereço estável para iniciar o download
          # sem uma etapa intermediária. O updater usa exclusivamente o runtime ZIP
          # versionado autorizado pelo manifesto assinado abaixo.
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_SIGNING_PRIVATE_KEY) -or
                [string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_SIGNING_PASSWORD)) {
              throw 'Stable releases require the protected update-manifest signing key.'
            }
            $privateKey = Join-Path $env:RUNNER_TEMP 'vemryx-one-release-private.pem'
            try {
              [IO.File]::WriteAllText(
                $privateKey,
                $env:UPDATE_MANIFEST_SIGNING_PRIVATE_KEY,
                [Text.UTF8Encoding]::new($false))
              $env:FIVEMCLEANER_SIGNING_PASSWORD = $env:UPDATE_MANIFEST_SIGNING_PASSWORD
              $minimum = (Get-Content -LiteralPath ./installer/minimum-update-version.txt -Raw).Trim()
              # The signed bridge remains on the legacy redirect so already-installed
              # 1.5.0 clients can accept this first release after the repository rename.
              $packageUrl = "https://github.com/marquezinii/FiveMCleaner/releases/download/$env:RELEASE_TAG/FiveMCleaner-Runtime-win-x64.zip"
              $signedManifest = './artifacts/release/FiveMCleaner-signed-update-manifest.json'
              dotnet run --project ./src/Vemryx.One.ReleaseTool/Vemryx.One.ReleaseTool.csproj `
                --configuration Release --no-build -- `
                sign ./artifacts/FiveMCleaner-Runtime-win-x64.zip stable $env:ASSET_VERSION `
                $minimum $packageUrl $privateKey $signedManifest
              if ($LASTEXITCODE -ne 0) { throw 'Signing the runtime manifest failed.' }
              dotnet run --project ./src/Vemryx.One.ReleaseTool/Vemryx.One.ReleaseTool.csproj `
                --configuration Release --no-build -- `
                verify $signedManifest ./src/Vemryx.One.App/Assets/update-manifest-public-key.pem $minimum
              if ($LASTEXITCODE -ne 0) { throw 'The signed manifest does not match the embedded public key.' }
            }
            finally {
              if (Test-Path -LiteralPath $privateKey) { Remove-Item -LiteralPath $privateKey -Force }
            }
            Copy-Item `
              -LiteralPath "./artifacts/installer/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe" `
              -Destination ./artifacts/release/VemryxOne-Setup-latest-win-x64.exe
            Copy-Item `
              -LiteralPath "./artifacts/installer/FiveMCleaner-Setup-$env:ASSET_VERSION-win-x64.exe" `
              -Destination ./artifacts/release/FiveMCleaner-Setup-latest-win-x64.exe
          }

          $changelog = Get-Content -LiteralPath ./CHANGELOG.md -Raw -Encoding utf8
          $escapedVersion = [regex]::Escape($env:ASSET_VERSION)
          $releaseChanges = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $releaseChanges.Success) {
            throw "CHANGELOG.md does not contain an entry for $env:ASSET_VERSION."
          }
          # O Discord consome o corpo da GitHub Release. Convertemos as seções
          # técnicas do changelog no formato público estável, sem cabeçalhos,
          # links ou avisos duplicados que a automação já fornece.
          $notes = $releaseChanges.Value.Trim()
          $notes = $notes -replace "(?m)^## \[$escapedVersion\].*\r?\n+", ''
          $notes = $notes -replace '(?m)^### Adicionado$', '## ✨ Novidades'
          $notes = $notes -replace '(?m)^### Melhorado$', '## 🔧 Melhorias'
          $notes = $notes -replace '(?m)^### Corrigido$', '## 🐛 Correções'
          $notes = $notes -replace '(?m)^### Segurança$', '## 🔒 Segurança'
          $notes = $notes -replace '(?m)^### Alterações técnicas$', '## ⚙️ Alterações técnicas'
          $notes.Trim() | Set-Content -LiteralPath ./artifacts/release/RELEASE_NOTES.md -Encoding utf8

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VemryxOne-signed-${{ needs.build_audit.outputs.asset_version }}
          path: artifacts/release/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: ${{ inputs.publish }}
    needs: [build_audit, sign_release]
    runs-on: windows-latest
    timeout-minutes: 10
    # Required reviewers are configured on this GitHub Environment; the job
    # cannot create a public release or deploy production before approval.
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download audited candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: VemryxOne-signed-${{ needs.build_audit.outputs.asset_version }}
          path: release

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*-Setup-*-win-x64.exe

      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release '$env:RELEASE_TAG' already exists; refusing to overwrite it."
          }

          $assets = @(
            (Resolve-Path "./release/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe").Path,
            (Resolve-Path "./release/VemryxOne-Setup-$env:ASSET_VERSION-win-x64.exe.sha256").Path,
            (Resolve-Path "./release/VemryxOne-release-manifest-$env:ASSET_VERSION.json").Path,
            (Resolve-Path "./release/FiveMCleaner-Setup-$env:ASSET_VERSION-win-x64.exe").Path,
            (Resolve-Path "./release/FiveMCleaner-Setup-$env:ASSET_VERSION-win-x64.exe.sha256").Path,
            (Resolve-Path ./release/FiveMCleaner-win-x64.zip).Path,
            (Resolve-Path ./release/FiveMCleaner-win-x64.zip.sha256).Path,
            (Resolve-Path ./release/FiveMCleaner-Runtime-win-x64.zip).Path,
            (Resolve-Path ./release/FiveMCleaner-Runtime-win-x64.zip.sha256).Path
          )
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            $assets += (Resolve-Path ./release/VemryxOne-Setup-latest-win-x64.exe).Path
            $assets += (Resolve-Path ./release/FiveMCleaner-Setup-latest-win-x64.exe).Path
            $assets += (Resolve-Path ./release/FiveMCleaner-signed-update-manifest.json).Path
          }
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG
          ) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "Vemryx One $env:RELEASE_TAG",
            '--notes-file', (Resolve-Path ./release/RELEASE_NOTES.md).Path
          )
          if ($env:RELEASE_CHANNEL -eq 'preview') {
            $arguments += '--prerelease'
          } else {
            $arguments += '--latest'
          }

          gh @arguments

      - name: Deploy updater telemetry and signed stable feed
        if: ${{ inputs.channel == 'stable' }}
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare credentials are required to publish the signed stable feed.'
          }
          Push-Location ./infra/cloudflare-worker
          try {
            npm ci
            npx.cmd wrangler d1 execute fivemcleaner-telemetry --remote --file=./schema.sql
            if ($LASTEXITCODE -ne 0) { throw 'Applying the updater telemetry schema failed.' }
            Get-Content -LiteralPath ../../release/FiveMCleaner-signed-update-manifest.json -Raw |
              npx.cmd wrangler secret put RELEASE_MANIFEST_JSON
            if ($LASTEXITCODE -ne 0) { throw 'Publishing the signed update feed failed.' }
            npx.cmd wrangler deploy
            if ($LASTEXITCODE -ne 0) { throw 'Deploying the updater Worker failed.' }
          }
          finally { Pop-Location }
